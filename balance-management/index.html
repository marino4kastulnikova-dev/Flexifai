<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance management prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* Tokens from Figma variables (Merchant's Office) */
:root{
  --background:#ffffff; --background-muted:#f9f9f9; --background-primary:#ededed; --foreground:#ffffff;
  --text-main:#222124; --text-secondary:#747474; --text-white:#ffffff;
  --outline:#e8e8e8; --brand-color:#410098; --brand-color-muted:#41009814; --hover-muted:#faf7ff;
  --menu-background:#222124; --menu-outline:#333235; --menu-text-muted:#817f87; --menu-primary-white:#ffffff;
  --menu-active-main:#b481ff; --menu-active-muted:#b481ff0f;
  --label-active:#00a634; --label-text-positive:#00a634; --label-text-negative:#be1002;
  --orange:#ed8400; --orange-muted:#fef5eb; --orange-text:#5f360a;
  --blue:#0067f8; --blue-muted:#eef4ff; --blue-text:#0b3d91;
  --red:#be1002; --red-muted:rgba(190,16,2,.06);
  --grey-dark:#b1b1b1; --button-icon:#747474;
  --strip:#ece7f3; --summary:#e9effa;
  --radius-button:10px; --radius-medium:16px;
  --space-small:4px; --space-medium:8px; --space-large:16px; --space-big:24px; --space-semi-huge:32px;
  --gradient-purple:linear-gradient(162.7deg,#a663ff 3.4%,#300071 95.8%);
  --font:"DM Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:14px;line-height:20px;color:var(--text-main);background:var(--background-primary);font-optical-sizing:auto;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.s16{width:16px;height:16px}.ic.s14{width:14px;height:14px}.ic.s24{width:24px;height:24px}
.app{display:flex;min-height:100vh}
/* Sidebar — sizes from Figma "Sidebar (FUNDS group, draft)" */
.sb{width:320px;flex:none;background:var(--menu-background);color:var(--menu-primary-white);padding:32px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-nav{flex:1;min-height:0;overflow-y:auto;margin:0 -8px;padding:0 8px;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}
.logo{display:flex;align-items:center;justify-content:space-between;height:64px;margin-bottom:16px;flex:none}
.logo .lt{width:176px;height:20px}.logo .lt svg{width:176px;height:20px;display:block}
.logo button{width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.logo button:hover{background:var(--menu-active-muted)}
.sb-group{display:flex;flex-direction:column;gap:24px;margin-top:40px}
.sb-sec{font-size:12px;line-height:16px;letter-spacing:.24px;text-transform:uppercase;color:var(--menu-text-muted)}
.sb-items{display:flex;flex-direction:column;gap:12px}
.sb-item{display:flex;align-items:center;gap:16px;height:48px;padding:8px 16px;border-radius:var(--radius-button);color:var(--menu-primary-white);width:100%;text-align:left;font-size:16px;line-height:24px;font-weight:400;border-left:3px solid transparent;transition:background .12s}
.sb-item svg{width:24px;height:24px;flex:none}
.sb-item:hover{background:var(--menu-active-muted)}
.sb-item.on{background:var(--menu-active-muted);border-left-color:var(--menu-active-main)}
.sb-foot{flex:none;display:flex;flex-direction:column;gap:20px;padding-top:20px}
.sb-foot .div{height:1px;background:var(--menu-outline)}
.prof{display:flex;gap:16px;align-items:center}
.ava{width:56px;height:56px;border-radius:100px;background:var(--menu-active-muted);display:grid;place-items:center;font-weight:500;font-size:20px;line-height:24px;flex:none}
.prof b{display:block;font-weight:500;font-size:16px;line-height:24px}
.prof small{display:block;color:var(--text-secondary);font-size:14px;line-height:20px;margin-top:4px}
/* Main */
.main{flex:1;min-width:0;padding:16px 16px 24px}
.panel{background:var(--background);border-radius:var(--radius-medium);padding:24px}
h1{font-size:28px;line-height:36px;font-weight:500;margin:0}
h2{font-size:20px;line-height:28px;font-weight:500;margin:0}
.sub{color:var(--text-secondary);font-size:12px;line-height:18px}
.hr{height:1px;background:var(--outline);margin:16px 0}
.lbl{font-size:12px;color:var(--text-secondary);margin:12px 0 6px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border-radius:var(--radius-button);font-weight:500;white-space:nowrap;border:1px solid transparent}
.btn.sm{height:32px;padding:0 14px;font-size:13px}
.btn.lg{height:48px;padding:0 32px;font-size:16px}
.btn.pri{background:var(--gradient-purple);color:#fff}
.btn.sec{background:var(--foreground);border-color:var(--outline)}
.btn.sec:hover{background:var(--hover-muted)}
.btn:disabled,.btn.dis{opacity:.4;cursor:not-allowed}
.btn.pri:disabled{opacity:.35}
.lnk{color:var(--blue);text-decoration:underline;cursor:pointer}
:focus-visible{outline:2px solid var(--menu-active-main);outline-offset:2px}
tr.r:focus-visible td{background:var(--hover-muted)}
.chip{height:40px;padding:0 12px;border-radius:var(--radius-button);background:var(--background-muted);border:1px solid transparent;font-size:14px;white-space:nowrap}
.bar-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.bar-row .btn{height:40px;padding:0 12px;font-size:14px;gap:6px}
.chip.on{background:var(--brand-color);color:#fff}
.pchip{height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--outline);background:#fff;display:inline-flex;align-items:center;gap:6px}
.pchip.on{border-color:var(--brand-color);background:var(--brand-color-muted);color:var(--brand-color)}
/* Attention blocks */
.nya{display:flex;align-items:center;gap:10px;background:var(--orange-muted);border:.5px solid var(--orange);color:var(--orange-text);border-radius:var(--radius-button);padding:10px 16px;margin-bottom:8px;font-size:14px}
.nya-chips{display:flex;gap:8px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:1px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
.nya-chips::-webkit-scrollbar{display:none}
.nya>.ic{color:var(--orange)}.nya>b{font-weight:500;white-space:nowrap}
.nya-chip{display:inline-flex;gap:8px;align-items:center;background:var(--background);border-radius:999px;padding:6px 12px;white-space:nowrap;flex:none;font-size:14px;line-height:20px}
.nya-chip b{font-weight:500}.nya-chip .a{color:var(--brand-color);font-weight:500}.nya-chip .m{color:var(--text-secondary)}
.nya-chip:hover{box-shadow:inset 0 0 0 1px var(--brand-color)}
.nya-link{color:var(--brand-color);font-weight:500;white-space:nowrap}
.nya.v-a .nya-chip{box-shadow:inset 0 0 0 1px var(--orange)}
.nya.v-b .nya-chip{background:var(--brand-color);color:#fff}.nya.v-b .nya-chip .a{color:#fff;text-decoration:underline}.nya.v-b .nya-chip .m{color:rgba(255,255,255,.7)}
.nya.v-c .nya-chip{box-shadow:0 2px 6px rgba(95,54,10,.16)}.nya.v-c .nya-chip .m{color:var(--orange);font-weight:500}
.nya.v-d .nya-chip{background:var(--brand-color-muted);box-shadow:inset 0 0 0 1px var(--brand-color)}
.nya.v-e .nya-chip{background:var(--orange);color:#fff}.nya.v-e .nya-chip .a{color:#fff;text-decoration:underline}.nya.v-e .nya-chip .m{color:rgba(255,255,255,.85)}
.nya.v-f .nya-chip{background:var(--brand-color);color:#fff}.nya.v-f .nya-chip .a{color:#fff;text-decoration:underline}.nya.v-f .nya-chip .m{color:rgba(255,255,255,.7)}
.nya.v-g .nya-chip{background:rgba(237,132,0,.18)}.nya.v-g .nya-chip .m{color:var(--orange-text)}
.nya.v-h .nya-chip{background:var(--menu-background);color:#fff}.nya.v-h .nya-chip .a{color:var(--menu-active-main)}.nya.v-h .nya-chip .m{color:var(--menu-text-muted)}
.nya-link:hover{text-decoration:underline}
.nya-chip{color:var(--text-main)}
.att{display:flex;align-items:flex-start;gap:12px;border:1px solid;border-radius:var(--radius-button);padding:12px 16px;margin-bottom:8px}
.att p{margin:0;flex:1;font-size:14px}
.att .ic{margin-top:2px}
.att.warn{background:var(--orange-muted);border-color:var(--orange);color:var(--orange-text)}
.att.warn>.ic{color:var(--orange)}
.att.info{background:var(--blue-muted);border-color:var(--blue);color:var(--blue-text)}
.att.info>.ic{color:var(--blue)}
.att.err{background:var(--red-muted);border-color:var(--red);color:var(--red)}
.att .acts{display:flex;gap:8px;flex:none}
.note{display:flex;gap:8px;align-items:flex-start;border:.5px solid;border-radius:var(--radius-button);padding:10px 16px;font-size:14px;margin:12px 0}
.note.warn{background:var(--orange-muted);border-color:var(--orange);color:var(--orange-text)}.note.warn .ic{color:var(--orange)}
.note.err{background:var(--red-muted);border-color:var(--red);color:var(--red)}
.note.info{background:var(--blue-muted);border-color:var(--blue);color:var(--blue-text)}.note.info .ic{color:var(--blue)}
/* Balances */
.groups-h{font-size:12px;color:var(--text-secondary);margin:14px 0 8px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{position:relative;z-index:0;background:var(--menu-background);color:#fff;border-radius:var(--radius-medium);padding:20px 20px 15px;min-height:0;overflow:visible;display:flex;flex-direction:column}
.card:has(.menu),.card:has(.tipwrap:hover),.card:has(.tipwrap:focus){z-index:50}
.card .wmc{position:absolute;inset:0;overflow:hidden;border-radius:var(--radius-medium);pointer-events:none}
.card .wm{position:absolute;right:-6px;bottom:-24px;font-size:150px;line-height:1;color:#2d2c30;font-weight:600;pointer-events:none;overflow:hidden;user-select:none}
.card-h{display:flex;align-items:center;gap:10px;position:relative;z-index:1;height:36px}
.card-h>div:nth-child(2){min-width:0;flex:1 1 0}
.card-h>.sp{display:none}
.card-h small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-h .t{white-space:normal;line-height:17px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-h .t:has(+small){-webkit-line-clamp:1}
.card-h .t{font-weight:500}
.card-h small{display:block;color:var(--menu-text-muted);font-size:12px;line-height:16px}
.cicon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;color:#fff;flex:none}
.cbtn{width:28px;height:28px;border-radius:50%;background:#3a383d;display:grid;place-items:center;color:#cfcdd3}
.cbtn.fav{color:var(--menu-active-main)}
.cbtn.fav .ic{fill:var(--menu-active-main)}
.card .av{margin-top:14px;font-size:12px;color:var(--menu-text-muted);position:relative;z-index:1}
.card .amt{font-size:26px;line-height:34px;position:relative;z-index:1}
.card .amt small{font-size:12px;color:var(--menu-text-muted);margin-left:6px}
.card .ny{font-size:11px;color:var(--menu-text-muted);position:relative;z-index:5;display:flex;align-items:center;gap:4px}
.ny-i{display:inline-flex;cursor:help}
.card .ny.ny-cut{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ny .ny-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .ny .ny-i{flex:none}
.tip.ny-tip{left:-6px;top:20px;font-size:13px;line-height:20px;padding:8px 14px;z-index:70;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tipwrap:focus>.tip{opacity:1}
.hold{margin-top:8px;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0;color:var(--menu-text-muted);font-size:11px;position:relative;z-index:1}
.hold.on{color:#f2a33a}
.cards .card{height:202px}
.addcard{border:1px dashed #d8d8d8;border-radius:var(--radius-medium);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:202px;color:var(--text-main);font-size:13px}
.addcard small{color:var(--text-secondary);font-size:11px}
.menu{position:absolute;z-index:60;background:#fff;color:var(--text-main);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:6px;min-width:200px}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:8px;font-size:13px;text-align:left;position:relative}
.menu .mi:hover{background:var(--hover-muted)}
.menu .mi.dis{color:#b8b8b8;cursor:not-allowed}
.soon{margin-left:auto;font-size:10px;background:var(--brand-color-muted);color:var(--brand-color);padding:1px 8px;border-radius:999px}
.tipwrap{position:relative}
.tip{position:absolute;z-index:40;background:#b481ff;color:#fff;font-size:12px;line-height:16px;padding:6px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
.tipwrap:hover>.tip{opacity:1}
.tip.dark{background:#222124}
/* Grid */
.toolbar{display:flex;align-items:center;gap:12px;margin:16px 0 8px}
.search{display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--outline);border-radius:var(--radius-button);padding:0 12px;width:260px;color:var(--text-secondary)}
.search input{border:0;outline:0;flex:1;min-width:0;color:var(--text-main)}
.fbtn{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.fbtn .bub{width:32px;height:32px;border-radius:50%;background:var(--gradient-purple);display:grid;place-items:center;color:#fff}
.fchips{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.fchip{display:inline-flex;gap:4px;align-items:center;height:24px;padding:0 8px;border-radius:6px;background:var(--brand-color-muted);color:var(--brand-color);font-size:12px}
.tbl{border:1px solid var(--outline);border-radius:var(--radius-button);overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-weight:400;font-size:12px;color:var(--text-secondary);text-align:left;padding:10px 12px;background:var(--background-muted);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
td{padding:12px;border-top:1px solid var(--outline);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr.r{cursor:pointer}
tr.r:hover td{background:var(--hover-muted)}
tr.r.awaiting td{background:#fef8f0}
tr.r.needs td{background:#f1f6ff}
td.cb,th.cb{width:40px}
.pos{color:var(--label-text-positive)}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;border:1px solid;white-space:nowrap}
.b-await{background:var(--orange);border-color:var(--orange);color:#fff}
.b-needs{background:var(--blue);border-color:var(--blue);color:#fff}
.b-blue{color:var(--blue);border-color:var(--blue)}
.b-green{color:var(--label-active);border-color:var(--label-active)}
.b-red{color:var(--red);border-color:var(--red)}
.b-grey{color:var(--text-secondary);border-color:var(--grey-dark)}
.b-done{background:var(--label-active);border-color:var(--label-active);color:#fff}
.empty{padding:56px 0;text-align:center}
.empty .t{font-size:18px;line-height:26px;margin:8px 0 4px}
.empty .ic{color:var(--text-secondary)}
.pager{display:flex;align-items:center;gap:12px;color:var(--text-secondary);font-size:12px;margin-top:12px}
.cbx{width:16px;height:16px;accent-color:var(--brand-color);cursor:pointer}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.exp-menu{right:0;top:44px}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(34,33,36,.62);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.ov.top{z-index:120;background:rgba(34,33,36,.35)}
.modal{background:#fff;border-radius:var(--radius-medium);width:720px;max-width:100%;max-height:calc(100vh - 48px);display:flex;flex-direction:column;overflow:hidden}
.modal.w-s{width:520px}.modal.w-m{width:620px}
.mh{display:flex;align-items:flex-start;gap:12px;padding:24px 24px 0}
.mh h2{font-size:28px;line-height:36px}
.mh .det{font-size:14px;color:var(--text-secondary);margin-left:8px;font-weight:400}
.xbtn{margin-left:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--text-secondary);border:1px solid var(--outline)}
.mb{padding:0 24px 16px;overflow:auto}
.mb>.hr:first-child{margin-top:16px}
.mf{background:var(--background-primary);padding:16px 24px;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.box{background:var(--background-muted);border-radius:var(--radius-medium);padding:16px;position:relative}
.box.err{box-shadow:inset 0 0 0 1px var(--red)}
.box+.box{margin-top:8px}
.fx-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-secondary)}
.maxb{height:26px;padding:0 12px;border-radius:999px;border:1px solid var(--outline);background:#fff;color:var(--brand-color);font-weight:500;margin-left:8px;font-size:12px}
.fx-mid{display:flex;align-items:center;gap:12px;margin-top:10px}
.sel{display:flex;align-items:center;gap:10px;text-align:left;border-radius:10px;padding:4px 6px;margin-left:-6px}
.sel:hover{background:#efefef}
.sel .t{font-size:15px;font-weight:500}
.sel small{display:block;color:var(--text-secondary);font-size:12px}
.amt-in{flex:1;text-align:right;border:0;background:transparent;outline:0;font-size:28px;line-height:36px;min-width:0}
.amt-in.bad{color:var(--red)}
.amt-out{flex:1;text-align:right;font-size:28px;line-height:36px;color:var(--text-secondary)}
.fx-err{color:var(--red);font-size:12px;text-align:right;margin-top:4px}
.fx-sub{color:var(--text-secondary);font-size:12px;text-align:right}
.swap{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);z-index:3;width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid var(--outline);display:grid;place-items:center;color:var(--text-main)}
.swap.dis{background:#f1f1f1;color:rgba(34,33,36,.3);cursor:not-allowed}
.swap .tip{bottom:auto;top:38px;left:50%;transform:translateX(-50%)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:var(--strip);border-radius:var(--radius-medium);padding:16px 20px;margin-top:16px}
.strip.four{grid-template-columns:repeat(3,1fr) auto}
.strip small{display:block;color:#6b6385;font-size:12px}
.strip b{font-weight:400;font-size:16px}
.hint{color:var(--text-secondary);font-size:12px;margin:10px 0 0}
.purp{display:flex;gap:8px;flex-wrap:wrap}
.tin{width:100%;height:44px;border:1px solid var(--outline);border-radius:var(--radius-button);padding:0 14px;outline:0;background:#fff}
.tin:focus{border-color:var(--brand-color)}
.tin.bad{border-color:var(--red)}
textarea.tin{height:auto;min-height:44px;padding:10px 14px;resize:vertical}
.ferr{color:var(--red);font-size:12px;margin-top:4px}
.dd{position:absolute;left:12px;right:12px;z-index:20;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;max-height:360px;overflow:auto}
.dd .gh{font-size:12px;color:var(--text-secondary);padding:8px 10px 4px}
.dd .op{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.dd .op:hover{background:var(--hover-muted)}
.dd .op.on{background:var(--brand-color-muted)}
.dd .op.dis{opacity:.45;cursor:not-allowed}
.dd .op small{display:block;color:var(--text-secondary);font-size:12px}
.kv{background:#fff;border-radius:12px;padding:4px 16px}
.kv .r{display:grid;grid-template-columns:160px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--outline);align-items:center}
.kv .r:first-child{border-top:0}
.kv .k{color:var(--text-secondary)}
.kv .v{word-break:break-all}
.kv .v.big{font-size:16px}
.sum{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;background:var(--summary);border-radius:12px;padding:14px 16px}
.sum small{display:block;font-size:12px;color:var(--text-secondary)}
.sum b{font-weight:400;color:var(--blue);font-size:15px}
.steps{display:flex;align-items:center;gap:8px;font-size:12px;margin:12px 0}
.steps .st{display:flex;align-items:center;gap:6px;color:var(--text-secondary)}
.steps .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid #cfcfcf}

/* ============ Grid ============ */
function filtered(){
 const f=S.f,q=S.ui.search.trim().toLowerCase();
 let rows=S.requests.filter(r=>{
  if(f.statuses.length&&!f.statuses.includes(r.status))return false;
  if(f.op&&opLabel(r)!==f.op)return false;
  if(f.project&&!projOf(r).includes(f.project))return false;
  if(f.account&&!accsOf(r).includes(f.account))return false;
  const u=pd(r.updated);
  if(f.from&&u<new Date(f.from+'T00:00'))return false;
  if(f.to&&u>new Date(f.to+'T23:59'))return false;
  return true});
 const filtersOnly=rows.length;
 if(q)rows=rows.filter(r=>r.id.toLowerCase().includes(q)||direction(r).toLowerCase().includes(q));
 const {key,dir}=S.ui.sort,m=dir==='asc'?1:-1;
 rows.sort((a,b)=>key==='amount'?(a.amount-b.amount)*m:key==='status'?(STORDER.indexOf(a.status)-STORDER.indexOf(b.status))*m:(pd(a.updated)-pd(b.updated))*m);
 return {rows,filtersOnly};
}
function filterChips(){
 const f=S.f,ch=[];
 if(f.from||f.to)ch.push(['upd',`Updated: ${f.from?ddate(new Date(f.from)):'…'}–${f.to?ddate(new Date(f.to)):'…'}`]);
 if(f.statuses.length){const g=Object.entries(GROUPS).find(([k,v])=>v.length===f.statuses.length&&v.every(s=>f.statuses.includes(s)));
  ch.push(['st',`Status: ${g?g[0]:f.statuses.map(s=>STATUS[s][0]).join(', ')}`]);}
 if(f.op)ch.push(['op',`Operation: ${f.op}`]);
 if(f.project)ch.push(['project',`Project: ${f.project}`]);
 if(f.account)ch.push(['account',`Account: ${accFull(acc(f.account))}`]);
 return ch;
}
function renderGrid(){

 </div>
 ${chips.length?`<div class="fchips">${chips.map(([k,t])=>`<span class="fchip">${esc(t)}<button data-act="rmChip" data-k="${k}">${I('x','s14')}</button></span>`).join('')}<span class="lnk" style="color:var(--brand-color);text-decoration:none;font-size:12px" data-act="clearFilters">Clear all</span></div>`:''}`;
 const head=`<tr><th class="cb"><input type="checkbox" class="cbx" data-act="selAll" aria-label="Select all" ${(()=>{const {rows}=filtered();return rows.length&&rows.every(r=>sel.has(r.id))?'checked':''})()}></th><th style="width:130px">Request ID</th><th style="width:150px">Operation</th><th>Direction</th>

 let body;
 if(S.ui.gridState==='loading')body=`<tr><td colspan="8" style="border:0"><div class="empty">${I('refresh','s24 spin')}<div class="sub">Loading...</div></div></td></tr>`;
 else if(S.ui.gridState==='failed')body=`<tr><td colspan="8" style="border:0;white-space:normal"><div class="note err">${I('alert','s16')}We couldn’t load your requests. Your balances are up to date. Check your connection and try again.</div><button class="btn sec" data-act="retryGrid">Try again</button></td></tr>`;
 else{const {rows}=filtered();
  if(!rows.length){
   body=S.ui.search.trim()?`<tr><td colspan="8" style="border:0"><div class="empty">${I('search','s24')}<div class="t">Nothing found for “${esc(S.ui.search.trim())}”</div><div class="sub">Check the request ID or the recipient name.</div><br><button class="btn sec" data-act="clearSearch">Clear search</button></div></td></tr>`
   :`<tr><td colspan="8" style="border:0"><div class="empty">${I('search','s24')}<div class="t">No requests match your filters</div><div class="sub">Try other filters or clear them.</div><br><button class="btn sec" data-act="clearFilters">Clear all</button></div></td></tr>`;
  }else body=rows.map(r=>{const recv=['rejected','cancelled'].includes(r.status)?'—':(r.approx&&!isFinal(r)?'≈ ':'')+fmt(r.status==='awaiting'&&r.await==='terms'?r.terms.receive:r.receive)+' '+r.toCur;

 }
 return tb+`<div class="tbl"><table>${head}${body}</table></div><div class="pager">${I('cl','s16')}${I('cr','s16')}<span>Page 1 of 1</span><span class="sp"></span><span>1 of 1</span></div>`;
}

/* ----- Transfer ----- */
function destOptions(from){
 const a=acc(from);
 if(a.kind==='crypto')return S.accounts.filter(x=>x.id!==from&&(x.kind==='crypto'||x.kind==='pay'));
 if(a.kind==='set')return S.accounts.filter(x=>x.kind==='pay'||x.kind==='crypto');
 return S.accounts.filter(x=>(x.kind==='pay'&&x.id!==from)||x.kind==='crypto');
}
function defaultDest(from){const a=acc(from),o=destOptions(from);return (o.find(x=>a.kind==='set'&&x.kind==='pay'&&x.cur===a.cur)||o.find(x=>a.kind==='crypto'&&x.kind==='crypto')||o[0]).id}
function tCalc(M){
 const f=acc(M.from),t=acc(M.to),amt=parseAmt(M.amountStr),conv=f.cur!==t.cur;
 const kr=conv?kraken(f.cur,t.cur):1,rate=conv?yourRate(f.cur,t.cur):1;
 const gross=r2(amt*rate),fee=t.kind==='pay'?r2(gross*D.tariff.transferToPayouts):0,receive=r2(gross-fee);
 const av=avail(f),over=amt>av;
 return {f,t,amt,conv,kr,rate,fee,receive,av,over,valid:amt>0&&!over};
}
function openTransfer(fromId){
 const from=fromId||'usdt';
 S.modal={type:'transfer',from,to:defaultDest(from),amountStr:'',purpose:D.purposes[0],comment:'',dd:null,stage:'form',err:false,fromLocked:!!fromId};
}
function accOption(a,act,on,extra){return `<button class="op ${on?'on':''}" data-act="${act}" data-id="${a.id}">${cardIcon(a)}<div><div>${a.kind==='crypto'?a.cur:accName(a)+(a.kind!=='crypto'?'':'')}${a.kind!=='crypto'?'':''}</div><small>${extra}</small></div></button>`}
function renderTransfer(M){
 const c=tCalc(M),{f,t}=c;
 if(M.stage==='review')return renderTransferReview(M,c);
 let swapEl;

function wAllowedNets(from){const a=acc(from);return a.kind==='crypto'?[a.net]:['TRON','ETH']}
function openWithdraw(fromId,opts={}){
 const from=fromId&&['crypto','set'].includes(acc(fromId).kind)?fromId:'usdt',nets=wAllowedNets(from);
 const w=S.wallets.find(x=>nets.includes(x.net)&&x.status==='active');
 S.modal={type:'withdraw',from,walletId:w?w.id:null,nw:w?null:{address:'',name:'',save:true},amountStr:'',purpose:D.purposes[0],comment:'',files:[],dd:null,stage:'form',err:false};
}
function wTarget(M){
 if(M.walletId){const w=S.wallets.find(x=>x.id===M.walletId);return {name:w.name,address:w.address,net:w.net,walletId:w.id}}
 const a=(M.nw.address||'').trim(),net=detectNet(a);return {name:M.nw.name||'New wallet',address:a,net,isNew:true};
}
function wCalc(M){
 const f=acc(M.from),tg=wTarget(M),amt=parseAmt(M.amountStr),nets=wAllowedNets(M.from);
 let addrErr='',addrBanner='';
 if(tg.isNew&&tg.address){
  if(f.kind==='crypto'&&tg.net!==f.net){addrErr=f.net==='TRON'?'Not a TRON address. It starts with T and has 34 characters.':'Not an Ethereum address. It starts with 0x and has 42 characters.'}
  else if(!tg.net){addrErr='Not a TRON or Ethereum address. Check that it is complete.'}
  else{const ownAsset=Object.keys(OWN).find(k=>OWN[k].toLowerCase()===tg.address.toLowerCase());
   if(ownAsset){addrErr=`This is your ${ownAsset} wallet in the cabinet.`;addrBanner='You can’t withdraw to this wallet’s own address.'}}
 }
 const net=tg.net&&nets.includes(tg.net)&&!addrErr?tg.net:(f.kind==='crypto'?f.net:null);
 const asset=net?ASSET[net]:null,conv=f.kind!=='crypto';
 const fee=asset?D.tariff.withdrawFee[asset]:null;
 const kr=conv&&asset?kraken(f.cur,asset):1,rate=conv&&asset?yourRate(f.cur,asset):1;
 const gross=r2(amt*rate),receive=asset&&!addrErr&&tg.address?r2(gross-fee):null;
 const av=avail(f),over=amt>av,lessFee=amt>0&&fee!=null&&gross<=fee;
 const valid=amt>0&&!over&&!lessFee&&tg.address&&!addrErr&&!!asset;
 return {f,tg,amt,conv,kr,rate,fee,asset,net,receive,av,over,lessFee,addrErr,addrBanner,valid};
}

function qrSvg(seed){let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;const n=25,cells=[];
 const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#222124"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#222124"/>`;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;h=(h*1103515245+12345)>>>0;if(h%100<46)cells.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="#222124"/>`)}
 return `<svg viewBox="-1 -1 27 27" width="150" height="150">${cells.join('')}${finder(0,0)}${finder(18,0)}${finder(0,18)}</svg>`}

   <div class="qr">${qrSvg(addr)}<div>Scan to send</div></div></div>

 </div></div>`;

/* ----- Details (D1–D3, C1–C2, S2–S3, RJ1–RJ3, MS1) ----- */
function steps(r){
 const names=r.op==='withdraw'?['Submitted','Finance review','Wallet check','Sent']:['Submitted','Finance review','Done'];
 let doneN,cur;
 if(['done','sent'].includes(r.status)){doneN=names.length;cur=-1}
 else if(['rejected','cancelled'].includes(r.status)){const stop=r.stopAt??1;
  return `<div class="steps">${names.slice(0,stop).map((n,i)=>`${i?'<span class="ln on"></span>':''}<span class="st done"><span class="dot"></span>${n}</span>`).join('')}<span class="ln" style="background:#222124"></span><span class="st rej"><span class="dot" style="background:#222124;border-color:#222124"></span>${r.status==='rejected'?'Rejected':'Cancelled'}</span></div>`}
 else{doneN=1;cur=(r.op==='withdraw'&&(r.step==='check'||(r.status==='awaiting'&&r.await==='aml')))?2:1}
 return `<div class="steps">${names.map((n,i)=>`${i?`<span class="ln ${i<=doneN-1||i===cur?'on':''}"></span>`:''}<span class="st ${i<doneN?'done':i===cur?'cur':''}"><span class="dot"></span>${n}</span>`).join('')}</div>`;
}
function renderDetails(M){
 const r=req(M.reqId);if(!r)return '';
 if(r.op==='settlement'){const s=r.st,a=acc(r.to);
  return `<div class="modal">${mHead(r.id,'details')}<div class="box"><div class="sum"><div><small>Payments</small><b>${fmt(s.payments)} EUR</b></div><div><small>Processing fees</small><b>${fmt(s.fees)} EUR</b></div><div><small>Credited</small><b>${fmt(r.receive)} EUR</b></div><div><small>Status</small>${badge(r.status)}</div></div><div style="height:12px"></div>
   ${kv([['Settlement ID',r.id,copyBtn(r.id)],['Account',accFull(a)],['Period',s.period],['Payments',s.count],['Held in reserve',`${fmt(s.reserve)} EUR · available on ${s.reserveOn}`],['Credited',r.updated]])}</div></div></div>`}
 if(r.op==='reserve'){const s=r.rr,a=acc(r.to);
  return `<div class="modal">${mHead(r.id,'details')}<div class="box"><div class="sum" style="grid-template-columns:repeat(3,1fr) auto"><div><small>Released</small><b>${fmt(r.amount)} EUR</b></div><div><small>Held from</small><b>${s.from}</b></div><div><small>Held for</small><b>${s.days} days</b></div><div><small>Status</small>${badge(r.status)}</div></div><div style="height:12px"></div>
   ${kv([['ID',r.id,copyBtn(r.id)],['Account',accFull(a)],['Settlement',`${s.from} · period ${s.period}`],['Held on',s.heldOn],['Released',s.released]])}</div></div></div>`}
 if(r.op==='addfunds'){const a=acc(r.to);
  return `<div class="modal">${mHead(r.id,'details')}<div class="box"><div class="sum"><div><small>Incoming</small><b>${fmt(r.amount)} ${r.fromCur}</b></div><div><small>Fee · 0.3% by your tariff</small><b>${fmt(r.fee)} ${r.toCur}</b></div><div><small>Credited</small><b>${r.status==='pending'?'≈ ':''}${fmt(r.receive)} ${r.toCur}</b></div><div><small>Status</small>${badge(r.status)}</div></div><div style="height:12px"></div>
   ${kv([['Request ID',r.id,copyBtn(r.id)],['From','External'],['To',accFull(a)],['Network',NET[a.net]],['Created',r.created],r.doneAt&&['Credited',r.doneAt]])}</div></div></div>`}
 const f=acc(r.from),isW=r.op==='withdraw',rej=r.status==='rejected',terms=r.status==='awaiting'&&r.await==='terms';
 const recv=rej||r.status==='cancelled'?'—':(r.approx&&!isFinal(r)?'≈ ':'')+fmt(terms?r.terms.receive:r.receive)+' '+r.toCur;
 const feeCell=rej?'—':`${fmt(r.fee)} ${r.feeCur}`;
 const sum=`<div class="sum"><div><small>You send</small><b>${fmt(r.amount)} ${r.fromCur}</b></div>
  ${!isW&&!r.fee&&r.conv?`<div><small>Your rate</small><b>1 ${r.fromCur} = ${rate4(r.rate)} ${r.toCur}</b></div>`:`<div><small>Fee · ${isW?'by your tariff':'0.1% by your tariff'}</small><b>${r.fee||isW?feeCell:'—'}</b></div>`}
  <div><small>${isW?(r.status==='sent'?'Wallet received':'Wallet receives'):'You receive'}</small><b>${recv}</b></div><div><small>Status</small>${badge(r.status)}</div></div>`;
 const toTxt=isW?`${esc(r.to.name)} · ${rej?short(r.to.address,r.to.net):(r.to.short||r.to.address)}`:accFull(acc(r.to));
 const rows=[['Request ID',r.id,copyBtn(r.id)],['From',accFull(f)]];
 if(isW&&r.conv&&!rej)rows.push(['Your rate',`1 ${r.fromCur} = ${rate4(r.rate)} ${r.toCur}`]);
 rows.push(['To',toTxt]);
 if(isW&&!rej&&r.status!=='needs_reply')rows.push(['Network',NET[r.to.net]]);
 if(!isW&&r.conv&&!rej)rows.push(['Your rate',`1 ${r.fromCur} = ${rate4(terms?r.terms.rate:r.rate)} ${r.toCur}`]);
 if(r.status==='sent')rows.push(['Transaction hash',`${r.hash} · <span class="lnk" data-act="dead">view in ${r.to.net==='TRON'?'Tronscan':'Etherscan'}</span>`]);
 if(rej){rows.push(['Reason',r.reject.kind==='aml'?'Your request was rejected. Contact support for details.':esc(r.reject.reason)]);rows.push(['Reserve',`${fmt(r.amount)} ${r.fromCur} released`]);rows.push(['Rejected',r.reject.at])}
 else if(r.status==='cancelled'){rows.push(['Reserve',`${fmt(r.amount)} ${r.fromCur} released`]);rows.push(['Cancelled',r.updated])}
 else{
  if(isW&&RESERVING.includes(r.status)&&r.status!=='needs_reply')rows.push(['Reserved',`${fmt(r.amount)} ${r.fromCur} on ${accParen(f)}`]);
  if(r.purpose&&r.status!=='needs_reply')rows.push(['Purpose',esc(r.purpose)]);
  if(r.files&&r.files.length)rows.push(['Documents',r.files.map(fl=>esc(fl.name)+' · '+fl.size).join('<br>')]);
  if(r.comment)rows.push(['Comment',esc(r.comment)]);
  rows.push(['Created',r.created]);
  if(r.status==='done')rows.push(['Done',r.doneAt]);
  else if(r.status==='sent')rows.push(['Sent',r.doneAt]);
  else if(!isW&&r.rateFixed&&r.status==='in_progress')rows.push(['Rate fixed',r.rateFixedAt||r.created]);
  else if(isW&&['submitted','in_progress'].includes(r.status))rows.push(['Next step','The finance team sends the withdrawal']);
 }
 const msgs=r.messages&&r.messages.length?`<div class="box" style="margin-top:8px"><div style="font-weight:500;margin-bottom:10px">Messages</div><div class="msgs">${r.messages.map(m=>`<div class="msg ${m.who==='me'?'me':''}"><small>${m.who==='me'?'You':'Finance team'} · ${m.at}</small>${esc(m.text)}${(m.files||[]).map(fl=>`<br><span class="att-file">${I('file','s14')}${esc(fl.name)} · ${fl.size}</span>`).join('')}</div>`).join('')}</div></div>`:'';
 let banner='';
 if(rej&&r.reject.kind==='public')banner=note('err',`The finance team rejected this request. The reserved ${fmt(r.amount)} ${r.fromCur} is available again. You can create a new request.`);
 if(!isW&&r.rateFixed&&RESERVING.includes(r.status)&&!terms)banner=note('info','This transfer can’t be cancelled: the rate was fixed and the deal was hedged when you confirmed it.');
 if(isW&&r.rateFixed&&RESERVING.includes(r.status))banner=note('info','This withdrawal can’t be cancelled: the rate was fixed when you confirmed it.');
 const btns=[];
 if(r.status==='needs_reply')btns.push(`<button class="btn pri" data-act="reply" data-id="${r.id}">Reply</button>`);
 if(terms)btns.push(`<button class="btn pri" data-act="openTerms" data-id="${r.id}">Accept terms</button>`);
 if(r.status==='awaiting'&&r.await==='aml')btns.push(`<button class="btn pri" data-act="chooseWallet" data-id="${r.id}">Choose wallet</button>`);
 if(canCancel(r))btns.unshift(`<button class="btn sec" data-act="cancelReq" data-id="${r.id}">Cancel request</button>`);
 if(r.rateFixed&&(RESERVING.includes(r.status)||['done','sent'].includes(r.status))&&!terms)btns.push(`<button class="btn sec" data-act="doc" data-d="deal-confirmation" data-id="${r.id}">Deal confirmation</button>`);
 if(['done','sent'].includes(r.status))btns.push(`<button class="btn sec" data-act="doc" data-d="payment-confirmation" data-id="${r.id}">Payment confirmation</button>`);
 if(rej&&r.reject.kind==='aml')btns.push(`<button class="btn sec" data-act="support">Contact support</button>`);
 if(rej&&r.reject.kind!=='aml')btns.push(`<button class="btn sec" data-act="newReq" data-id="${r.id}">Create new request</button>`);
 return `<div class="modal">${mHead(r.id,'details')}<div class="box">${sum}${steps(r)}${kv(rows)}</div>${msgs}${banner}</div>${btns.length?`<div class="mf">${btns.join('')}</div>`:''}</div>`;
}

/* ============ Request lifecycle ============ */
function submitTransfer(){
 const M=S.modal,c=tCalc(M);
 if(S.ui.failNext){S.ui.failNext=false;M.err=true;return render()}
 const t=now(),id=nextId();
 S.requests.unshift({id,op:'transfer',from:M.from,to:M.to,amount:c.amt,fromCur:c.f.cur,receive:c.receive,toCur:c.t.cur,fee:c.fee,feeCur:c.t.cur,conv:c.conv,rate:c.rate,kraken:c.kr,rateFixed:c.conv,rateFixedAt:c.conv?t:null,approx:c.conv,comment:M.comment,created:t,updated:t,status:'submitted',step:'review'});
 notify('Transfer submitted',`${id} · ${fmt(c.amt)} ${c.f.cur} reserved.`,id);
 S.modal=null;toast(`Transfer ${id} submitted · ${fmt(c.amt)} ${c.f.cur} reserved`);render();
}
function submitWithdraw(){
 const M=S.modal,c=wCalc(M);
 if(S.ui.failNext){S.ui.failNext=false;M.err=true;return render()}
 const t=now(),id=nextId();let to=c.tg;
 const dup=to.isNew&&S.wallets.find(w=>w.address.toLowerCase()===to.address.toLowerCase());
 if(dup)to=wsnap(dup);
 else if(to.isNew&&M.nw.save){const w={id:'w'+Date.now(),name:M.nw.name||'New wallet',net:c.net,address:to.address,withdrawals:0,totalW:0,last:'',lastRel:'no withdrawals yet',added:t.slice(0,10),aml:'—',status:'active'};S.wallets.push(w);to={...wsnap(w)}}
 else to={walletId:to.walletId,name:to.name,address:to.address,net:c.net};
 S.requests.unshift({id,op:'withdraw',from:M.from,to,amount:c.amt,fromCur:c.f.cur,receive:c.receive,toCur:c.asset,fee:c.fee,feeCur:c.asset,conv:c.conv,rate:c.rate,kraken:c.kr,rateFixed:c.conv,approx:c.conv,purpose:isSetW(M)?M.purpose:undefined,files:isSetW(M)?M.files:undefined,comment:M.comment,created:t,updated:t,status:'submitted',step:'review'});
 notify('Withdrawal submitted',`${id} · ${fmt(c.amt)} ${c.f.cur} reserved.`,id);
 S.modal=null;toast(`Withdrawal ${id} submitted · ${fmt(c.amt)} ${c.f.cur} reserved`);render();
}
function setStatus(r,st){r.status=st;r.updated=now()}
function release(r,kind,reason,deadline){
 const stopAt=r.op==='withdraw'&&(r.step==='check'||r.await==='aml')?2:1;r.stopAt=stopAt;
 const t=now(),at=kind==='auto'&&deadline?deadline:t;r.status='rejected';r.updated=at;r.reject={kind,reason,at};
 notify('Request rejected',`${r.id} · ${fmt(r.amount)} ${r.fromCur}. ${kind==='aml'?'Contact support for details. ':''}The reserve is released.`,r.id);
}
function execute(r){
 const t=now();
 if(r.op==='addfunds'){acc(r.to).total=r2(acc(r.to).total+r.receive);r.status='credited';r.updated=t;r.doneAt=t;notify('Funds credited',`${r.id} · ${fmt(r.receive)} ${r.toCur} credited to ${accName(acc(r.to))}.`,r.id);toast(`${fmt(r.receive)} ${r.toCur} credited to ${accName(acc(r.to))}`);return}
 const f=acc(r.from);f.total=r2(f.total-r.amount);
 if(r.op==='transfer'){const to=acc(r.to);to.total=r2(to.total+r.receive);r.status='done';r.doneAt=t;r.approx=false;notify('Transfer done',`${r.id} · ${fmt(r.receive)} ${r.toCur} credited to ${accFull(to)}.`,r.id);toast(`Transfer ${r.id} done · ${fmt(r.receive)} ${r.toCur} credited`)}
 else{r.status='sent';r.doneAt=t;r.approx=false;r.hash=Math.random().toString(16).slice(2,10)+'…'+Math.random().toString(16).slice(2,9);
  const w=S.wallets.find(x=>x.id===r.to.walletId);if(w){w.withdrawals++;w.totalW=r2(w.totalW+r.receive);w.last=t.slice(0,10);w.lastRel='last withdrawal today';w.aml=t.slice(0,10)+' · passed'}
  notify('Withdrawal sent',`${r.id} · ${fmt(r.receive)} ${r.toCur} sent to ${r.to.name}.`,r.id);toast(`Withdrawal ${r.id} sent · ${fmt(r.receive)} ${r.toCur}`)}
 r.updated=t;
}

 dRejAuto:()=>{const r=req(S.demoReq);const dl=r.status==='needs_reply'?r.question.deadline:r.terms?.deadline||now();
  release(r,'auto',r.status==='needs_reply'?`No reply to the finance team’s question by ${dl}`:`No decision on the new terms by ${dl}`,dl);toast(`${r.id} rejected automatically`);render()},
 dIncoming:()=>{const t=now(),id=nextId();S.requests.unshift({id,op:'addfunds',from:null,to:'usdt',amount:1000,fromCur:'USDT',receive:997,toCur:'USDT',fee:3,feeCur:'USDT',approx:true,created:t,updated:t,status:'pending'});S.demoReq=id;S.page='bm';toast(`Incoming transfer detected on your USDT address · ${id} Pending`);render()},
 dChip:d=>{S.ui.chipVar=d.v;render()},
 dFA1:()=>{S.modal={type:'fa1'};render()},
 dToggle:d=>{S.ui[d.k]=!S.ui[d.k];render()},
 dGridFail:()=>{S.page='bm';S.ui.gridState='failed';render()},
 dLoading:()=>{S.ui.loading=true;render();setTimeout(()=>{S.ui.loading=false;render()},1800)},
 dZero:()=>{const a=acc('set-eur');a.total=hold(a);S.page='bm';toast('EUR · Settlements: available balance is 0.00');render()},
 dNoWallets:()=>{S.wallets=[];S.page='mw';render()},
 dNoNotifs:()=>{S.notifs=[];S.page='home';S.ui.notifOpen=true;render()},
};
function askCancel(r){
 const f=acc(r.from);
 S.confirm={title:`Cancel request ${r.id}?`,text:`The ${r.op==='withdraw'?'withdrawal won’t be sent':'transfer won’t be executed'}. ${fmt(r.amount)} ${r.fromCur} reserved on ${accParen(f)} becomes available again.`,yes:'Cancel request',
  onYes:()=>{r.await=null;setStatus(r,'cancelled');notify('Request cancelled',`${r.id} · ${fmt(r.amount)} ${r.fromCur} is available again.`,r.id);S.modal=null;toast(`Request ${r.id} cancelled · ${fmt(r.amount)} ${r.fromCur} available again`)}};
 render();
}
function tryClose(){
 const M=S.modal;
 if(M&&(M.type==='transfer'||M.type==='withdraw')&&parseAmt(M.amountStr)>0){
  const t=M.type==='transfer';
  S.confirm={title:t?'Leave without transferring?':'Leave without withdrawing?',text:t?'The transfer isn’t submitted and nothing is reserved. The amount and purpose you entered will be lost.':'The withdrawal isn’t submitted and nothing is reserved. The amount and wallet you entered will be lost.',no:'Keep editing',yes:'Leave',onYes:()=>{S.modal=null}};
  return render();
 }
 S.modal=null;render();
}

/* ============ Events ============ */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(!el){if(S.ui.menu||S.ui.exportMenu||S.ui.notifOpen||(S.modal&&S.modal.dd)){S.ui.menu=null;S.ui.exportMenu=false;if(!e.target.closest('.npanel'))S.ui.notifOpen=false;if(S.modal&&!e.target.closest('.dd'))S.modal.dd=null;render()}return}
 const act=el.dataset.act;
 if(S.modal&&S.modal.dd&&!el.closest('.dd')&&!e.target.closest('.dd')&&act!=='tDD'){S.modal.dd=null;if(act==='ovClick'&&e.target!==el){render();return}}
 if(el.type==='checkbox'&&act!=='selRow'&&act!=='selAll'){e.preventDefault()}
 if(act==='details'&&e.target.closest('[data-stop]')&&!e.target.closest('[data-act="selRow"]'))return;
 if(act!=='cardmenu'&&!el.closest('.menu'))S.ui.menu=S.ui.menu&&act==='fav'?S.ui.menu:null;
 if(act!=='exportMenu'&&act!=='exportFmt')S.ui.exportMenu=false;
 A[act]&&A[act](el.dataset,el,e);
});
document.addEventListener('input',e=>{
 const k=e.target.dataset.in;if(!k)return;const v=e.target.value,M=S.modal;
 const map={
  search:()=>{S.ui.search=v;S.ui.sel.clear()},wsearch:()=>{S.ui.wsearch=v},
  tAmount:()=>{M.amountStr=cleanAmt(v)},wAmount:()=>{M.amountStr=cleanAmt(v)},
  comment:()=>{M.comment=v;return 'nr'},nwAddr:()=>{M.nw.address=v},nwName:()=>{M.nw.name=v;return 'nr'},
  replyText:()=>{M.text=v},fFrom:()=>{M.draft.from=v},fTo:()=>{M.draft.to=v},fOp:()=>{M.draft.op=v},fProject:()=>{M.draft.project=v},fAccount:()=>{M.draft.account=v},
  eFrom:()=>{M.from=v},eTo:()=>{M.to=v},awAddr:()=>{M.address=v},awName:()=>{M.name=v},wRename:()=>{M.newName=v;return 'nr'},
  demoReq:()=>{S.demoReq=v},demoReason:()=>{S.ui.reason=v;return 'nr'},
 };
 if(map[k]&&map[k]()!=='nr')render();
});
document.addEventListener('change',e=>{const k=e.target.dataset.in;if(['fOp','fProject','fAccount','demoReq','demoReason','fFrom','fTo','eFrom','eTo'].includes(k))e.target.dispatchEvent(new Event('input',{bubbles:true}))});
document.addEventListener('keydown',e=>{const t=e.target;if((e.key==='Enter'||e.key===' ')&&t.dataset&&t.dataset.act&&!/^(BUTTON|INPUT|SELECT|TEXTAREA|A)$/.test(t.tagName)){e.preventDefault();t.click();return}
 if(e.key==='Tab'&&(S.modal||S.confirm)){const root=document.querySelector(S.confirm?'.confirm':'.modal');const f=[...root.querySelectorAll('button:not([disabled]),input,select,textarea,[tabindex="0"]')];if(f.length){const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}else if(i<0){e.preventDefault();f[0].focus()}}}
 if(e.key==='Escape'){if(S.confirm){S.confirm=null;render()}else if(S.modal)tryClose()}});
function addFiles(list){const M=S.modal;if(!M||!(M.type==='reply'||isSetW(M)))return;M.fileErr='';
 for(const f of list){if(M.files.length>=5)break;if(!/\.(pdf|jpe?g|png)$/i.test(f.name)){M.fileErr='Only PDF, JPG or PNG files.';continue}if(f.size>10*1024*1024){M.fileErr=`${f.name} is larger than 10 MB.`;continue}
  M.files.push({name:f.name,size:f.size>1048576?(f.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(f.size/1024))+' KB'})}render()}
document.getElementById('filepick').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});
function bindDrop(){const d=document.getElementById('drop');if(!d)return;
 d.ondragover=e=>{e.preventDefault();d.classList.add('hov')};d.ondragleave=()=>d.classList.remove('hov');d.ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)}}

if(location.hash==='#wallets')S.page='mw';
render();
</script>
